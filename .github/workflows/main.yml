name: DEVXRDP – RDP + Tailscale (Auto-Rerun)

on:
  workflow_dispatch:
    inputs:
      ts_authkey:
        description: "Tailscale Auth Key (tskey-auth-XXXX)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: devxrdp-single-session
  cancel-in-progress: false

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 300   # EXACT 5 HOURS

    env:
      # ===== RDP CREDENTIALS =====
      RDP_USER: DEVXRDP
      RDP_PASS: Rdp!9Xq#2025

      # ===== FIXED TAILSCALE NAME =====
      TS_HOSTNAME: DEVXRDP

    steps:

      - name: Install and start Tailscale
        run: |
          $exe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $exe)) {
            Invoke-WebRequest `
              -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" `
              -OutFile "$env:TEMP\tailscale.msi"

            Start-Process msiexec.exe -Wait `
              -ArgumentList "/i","$env:TEMP\tailscale.msi","/quiet","/norestart"
          }

          & $exe logout | Out-Null
          & $exe up `
            --authkey "${{ inputs.ts_authkey }}" `
            --hostname "$env:TS_HOSTNAME" `
            --accept-dns=false `
            --reset

      - name: Show Tailscale IP (DEVXRDP)
        run: |
          $exe = "$env:ProgramFiles\Tailscale\tailscale.exe"
          $ip = & $exe ip -4 | Select-Object -First 1

          Write-Host ""
          Write-Host "================================="
          Write-Host " RDP NAME : DEVXRDP"
          Write-Host " RDP IP   : $ip"
          Write-Host " USER     : DEVXRDP"
          Write-Host "================================="

      - name: Enable RDP
        run: |
          $sec = ConvertTo-SecureString $env:RDP_PASS -AsPlainText -Force

          if (-not (Get-LocalUser -Name $env:RDP_USER -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name $env:RDP_USER -Password $sec -AccountNeverExpires
            Add-LocalGroupMember Administrators $env:RDP_USER
            Add-LocalGroupMember "Remote Desktop Users" $env:RDP_USER
          } else {
            Set-LocalUser -Name $env:RDP_USER -Password $sec
            Enable-LocalUser $env:RDP_USER
          }

          Set-ItemProperty `
            "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name fDenyTSConnections `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: KEEP ALIVE (5 HOURS CONTINUOUS)
        run: |
          $end = (Get-Date).AddHours(5)
          while ((Get-Date) -lt $end) {
            Start-Sleep -Seconds 60
          }

      - name: Auto Rerun Workflow
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TS_AUTHKEY: ${{ inputs.ts_authkey }}
        run: |
          $headers = @{
            "Authorization" = "Bearer $env:GH_PAT"
            "Accept"        = "application/vnd.github+json"
          }
          
          $body = @{
            ref = "main"
            inputs = @{
              ts_authkey = "$env:TS_AUTHKEY"
            }
          } | ConvertTo-Json

          # Yahan file ka naam seedha 'main.yml' kar diya hai
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/main.yml/dispatches"
          
          try {
            Invoke-RestMethod -Uri $uri -Method Post -Headers $headers -Body $body
            Write-Host "Successfully triggered the next RDP session!"
          } catch {
            Write-Host "Failed to trigger rerun: $_"
          }

      - name: Finished
        run: echo "DEVXRDP session ended and next session triggered."
